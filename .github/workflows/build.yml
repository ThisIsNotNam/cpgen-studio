name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "release-*", "beta-release-*", "alpha-release-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cpgen-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cpgen-studio-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Download Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: cpgen-studio-windows
          path: dist-artifact

      - name: Download Linux artifact
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/download-artifact@v4
        with:
          name: cpgen-studio-linux
          path: dist-artifact

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-artifact -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in artifact" }

          # NSIS installers support silent install
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait

          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter "cpgen-studio.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) {
            $installed = Get-ChildItem -Path "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter "cpgen-studio.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $installed) { throw "Could not locate cpgen-studio.exe after install" }

          $proc = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            throw "App exited unexpectedly after launch (exit code $($proc.ExitCode))"
          }

          Stop-Process -Id $proc.Id -Force
          Write-Host "Smoke test passed: app launched and stayed running."

      - name: Install AppImage runtime deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0

      - name: Smoke test (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          APPIMAGE=$(find dist-artifact -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No .AppImage found in artifact"
            exit 1
          fi
          chmod +x "$APPIMAGE"

          xvfb-run --auto-servernum "$APPIMAGE" &
          APP_PID=$!

          sleep 8

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "App exited unexpectedly after launch"
            exit 1
          fi

          kill "$APP_PID"
          echo "Smoke test passed: app launched and stayed running."

  publish:
    needs: [build, smoke-test]
    if: |
      startsWith(github.ref, 'refs/tags/release-') ||
      startsWith(github.ref, 'refs/tags/beta-release-') ||
      startsWith(github.ref, 'refs/tags/alpha-release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine release channel
        id: channel
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == alpha-release-* || "$REF" == beta-release-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cpgen-studio-windows
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cpgen-studio-linux
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage
